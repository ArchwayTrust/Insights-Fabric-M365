name: Tests

# Runs on pull requests into main and pushes to main. release.yml also calls it before publishing.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Fabric runtimes use Python 3.10 (Runtime 1.2) and 3.11 (Runtime 1.3)
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package and test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test] build twine

    - name: Lint
      run: python -m pyflakes archwaytrust_fabric legacy tests setup.py

    - name: Run tests
      run: python -m pytest -v

    - name: Build and check package
      run: |
        python -m build
        python -m twine check --strict dist/*

    - name: Build and check the fabric_python_helper forwarding package
      run: |
        python -m build legacy
        python -m twine check --strict legacy/dist/*
