name: Tests

# Runs on pull requests into main and pushes to main. release.yml also calls it before publishing.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Fabric runtimes use Python 3.10 (Runtime 1.2) and 3.11 (Runtime 1.3)
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package and test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test] build twine

    - name: Lint
      run: python -m pyflakes alt_fabric_m365 tests setup.py

    - name: Run tests
      run: python -m pytest -v

    - name: Build and check package
      run: |
        python -m build
        python -m twine check --strict dist/*

    # The steps above test the source tree, which an editable install imports from, so a module or file left out of
    # the wheel would still pass. Run the tests again against the wheel, installed as users install it. From tests/,
    # the source tree isn't on the import path.
    - name: Test the built wheel
      run: |
        python -m venv "$RUNNER_TEMP/wheel"
        "$RUNNER_TEMP/wheel/bin/pip" install "$(ls dist/*.whl)[test]"
        cd tests
        "$RUNNER_TEMP/wheel/bin/python" -c "import alt_fabric_m365; assert 'site-packages' in alt_fabric_m365.__file__, alt_fabric_m365.__file__"
        "$RUNNER_TEMP/wheel/bin/python" -m pytest -q
