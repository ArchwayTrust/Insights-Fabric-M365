name: Release

# Publishing a GitHub release tagged v<version> runs the tests, then publishes to PyPI and attaches
# the wheel and source distribution to the release. Nothing is published from a push or pull request.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # All history and branches, to check the tagged commit is on main
        fetch-depth: 0

    # A release can be tagged on any commit, so this stops an unreviewed commit being published by mistake. It isn't
    # a security control: a release runs this file as it is at the tagged commit, which could have the check removed.
    # The tag ruleset and the pypi environment's reviewers, which the README describes, are what stop that.
    - name: Check the tagged commit is on main
      run: |
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "::error::Release tag $GITHUB_REF_NAME is on commit $GITHUB_SHA, which isn't on main. Only commits merged into main can be released."
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine setuptools

    - name: Check the release tag matches __version__
      run: |
        VERSION=$(python setup.py --version | tail -n 1)
        TAG="${GITHUB_REF_NAME#v}"
        if [ "$TAG" != "$VERSION" ]; then
          echo "::error::Release tag $GITHUB_REF_NAME doesn't match __version__ $VERSION in alt_fabric_m365/__init__.py"
          exit 1
        fi

    - name: Build and check package
      run: |
        python -m build
        python -m twine check --strict dist/*

    - name: Save package
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    # PyPI only accepts uploads from this workflow and environment (Trusted Publishing), so no API token is stored
    environment:
      name: pypi
      url: https://pypi.org/project/alt-fabric-m365/
    permissions:
      id-token: write

    steps:
    - name: Download package
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  release-assets:
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Download package
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Attach package to the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
